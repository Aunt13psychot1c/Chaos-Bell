name: Build My APK

# One-tap build for this fork: Actions > Build My APK > Run workflow.
# Builds the "preview" variant, which is signed with the standard debug key, so
# it needs no signing secrets. It installs next to any existing SwiftSlate as a
# separate app (package com.musheer360.swiftslate.preview).
on:
  workflow_dispatch:
  # Test-compile every side branch automatically, so work-in-progress gets checked
  # before it ever reaches main. Main itself only builds when someone taps Run workflow.
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build preview APK
        shell: bash
        run: |
          set -o pipefail
          # On failure, repeat the build's complaints as one annotation on the run's summary page.
          ./gradlew testDebugUnitTest assemblePreview --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -v '> Task' build.log | grep -E -A2 '^e: |rror|What went wrong|Caused by|FAILED|Expected|but was' |
              head -40 | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error::/'
            echo
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Chaos-Bell-preview
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 30
